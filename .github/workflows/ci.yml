name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/student_registration_development_placeholder
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/student_registration_test
      TEST_DATABASE_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: production
      - run: npm run test:integration
      - run: npm run test:e2e
      # Keep the full report visible; the policy step is the promotion gate.
      - name: Plain dependency audit (informational)
        run: npm audit
        continue-on-error: true
      - name: Dependency promotion policy
        run: npm run audit:policy

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
