databases:
  - name: sharelinkstudent-db
    plan: free
    region: singapore
    databaseName: sharelinkstudent
    user: sharelinkstudent
    ipAllowList: []

services:
  - type: web
    name: sharelinkstudent-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sharelinkstudent-db
          property: connectionString
      - key: PRODUCTION_DATABASE_ALLOWED_HOSTS
        fromDatabase:
          name: sharelinkstudent-db
          property: host
      - key: PRODUCTION_DATABASE_ALLOWED_NAMES
        fromDatabase:
          name: sharelinkstudent-db
          property: database
      - key: RATE_LIMIT_REDIS_REST_URL
        sync: false
      - key: RATE_LIMIT_REDIS_REST_TOKEN
        sync: false
      - key: PRODUCTION_REDIS_ALLOWED_HOSTS
        sync: false
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: REQUEST_BODY_MAX_BYTES
        value: "65536"
      - key: ADMIN_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: ADMIN_LOGIN_LOCK_SECONDS
        value: "900"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_HSTS
        value: "false"
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
